<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MINER — Offline Mining Empire</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090b10;color:#e8edf5;font-family:Inter,system-ui,Arial,sans-serif}
button,input{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
#auth{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 10%,#202938 0,#090b10 55%)}
.authbox{width:min(420px,92vw);padding:32px;border:1px solid #293342;border-radius:20px;background:#10151d;box-shadow:0 20px 80px #0008}
.logo{font-size:42px;font-weight:900;letter-spacing:5px}.muted{color:#8995a7}.authbox input{width:100%;padding:13px;margin:7px 0;border-radius:10px;border:1px solid #303b4b;background:#0a0e14;color:white}
.primary{width:100%;padding:13px;margin-top:10px;border-radius:10px;background:#d8a84e;color:#111;font-weight:800}.switch{margin-top:16px;text-align:center;color:#9eabc0;cursor:pointer}
#app{min-height:100vh}.top{height:68px;border-bottom:1px solid #252d39;background:#0e131a;display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:5}
.brand{font-weight:900;letter-spacing:3px}.money{font-size:20px;font-weight:800;color:#f0c86b}
.layout{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;padding:18px;max-width:1300px;margin:auto}
.card{background:#10151d;border:1px solid #252e3b;border-radius:16px;padding:18px}.mine{min-height:500px}
.rock{height:300px;border-radius:16px;display:grid;place-items:center;background:radial-gradient(circle,#3b4148 0,#1c2026 42%,#0d1015 75%);box-shadow:inset 0 0 70px #000;position:relative;overflow:hidden}
.rock:before{content:"";width:260px;height:220px;border-radius:48% 52% 42% 58%;background:linear-gradient(145deg,#72777c,#30353b 65%,#171a1e);box-shadow:inset -20px -20px 30px #0008,0 20px 40px #000;transform:rotate(-7deg)}
.pick{position:absolute;font-size:70px;filter:drop-shadow(8px 10px 5px #000);transform:rotate(-35deg);transition:.08s}.pick.hit{transform:rotate(-55deg) scale(1.05)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.stat{background:#0b0f15;padding:12px;border-radius:10px}.value{font-size:21px;font-weight:800;margin-top:4px}
.actions{display:flex;gap:10px;margin-top:12px}.minebtn{flex:1;padding:15px;border-radius:11px;background:#c9933c;color:#111;font-weight:900;font-size:18px}.minebtn:active{transform:scale(.98)}
.upgrades{display:grid;gap:10px}.upgrade{display:flex;justify-content:space-between;align-items:center;padding:14px;background:#0b0f15;border:1px solid #202938;border-radius:12px}.upgrade b{display:block}.upgrade small{color:#8995a7}.buy{padding:9px 12px;border-radius:9px;background:#273342;color:#fff}.buy:disabled{opacity:.4;cursor:not-allowed}
.log{height:150px;overflow:auto;font-size:12px;color:#8491a3;background:#0a0d12;border-radius:10px;padding:10px;margin-top:12px}.row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #171d25}
#toast{position:fixed;right:18px;bottom:18px;background:#d8a84e;color:#111;padding:12px 15px;border-radius:10px;font-weight:800;display:none}
@media(max-width:800px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.rock{height:240px}}
</style>
</head>
<body>
<section id="auth">
<div class="authbox">
<div class="logo">MINER</div>
<p class="muted">Build your mining empire. Progress is saved locally and continues while you're away.</p>
<div id="authForm">
<input id="username" placeholder="Username" maxlength="20" autocomplete="username">
<input id="password" type="password" placeholder="Password" maxlength="50" autocomplete="current-password">
<button class="primary" id="authBtn">Create account</button>
<div class="switch" id="switch">Already have an account? Log in</div>
<div id="authMsg" class="muted" style="margin-top:10px"></div>
</div>
</div>
</section>

<section id="app" class="hidden">
<header class="top">
<div class="brand">⛏ MINER</div>
<div><span id="userLabel" class="muted"></span> &nbsp; <span class="money">$<span id="money">0</span></span></div>
</header>
<main class="layout">
<div>
<div class="card mine">
<h2>Active Mine</h2>
<div class="rock" id="rock"><div class="pick" id="pick">⛏️</div></div>
<div class="stats">
<div class="stat">Ore<div class="value" id="ore">0</div></div>
<div class="stat">Power<div class="value" id="power">1</div></div>
<div class="stat">Auto/sec<div class="value" id="auto">0</div></div>
</div>
<div class="actions"><button class="minebtn" id="mineBtn">⛏ MINE ROCK</button></div>
<div class="log" id="log"></div>
</div>
</div>
<div>
<div class="card">
<h2>Upgrades</h2>
<div class="upgrades" id="upgrades"></div>
</div>
<div class="card" style="margin-top:18px">
<h2>Offline Report</h2>
<div id="offline" class="muted">No offline earnings yet.</div>
</div>
<div class="card" style="margin-top:18px">
<button class="buy" id="reset" style="width:100%">Reset this account</button>
</div>
</div>
</main>
</section>
<div id="toast"></div>

<script>
const KEY="MINER_ACCOUNTS_V1";
let accounts=JSON.parse(localStorage.getItem(KEY)||"{}");
let current=null, loginMode=false, lastSave=Date.now(), lastTick=Date.now();

const $=id=>document.getElementById(id);
const fmt=n=>Math.floor(n).toLocaleString();
function saveAccounts(){localStorage.setItem(KEY,JSON.stringify(accounts))}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(16)}
function toast(t){$("toast").textContent=t;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",1600)}
function addLog(t){$("log").innerHTML=`<div>${new Date().toLocaleTimeString()} — ${t}</div>`+$("log").innerHTML}

const defs=[
{id:"power",name:"Stronger Pickaxe",desc:"+1 ore per manual hit",base:25,step:1},
{id:"auto",name:"Mining Drill",desc:"+1 automatic ore/sec",base:100,step:1},
{id:"mult",name:"Ore Crusher",desc:"x2 ore value",base:500,step:1},
{id:"deep",name:"Deep Mine",desc:"+5 ore per manual hit",base:2500,step:5}
];
function cost(d){return Math.floor(d.base*Math.pow(d.id==="mult"?3:1.65,current.upgrades[d.id]||0))}
function renderUpgrades(){
$("upgrades").innerHTML=defs.map(d=>{
let lv=current.upgrades[d.id]||0,c=cost(d);
return `<div class="upgrade"><div><b>${d.name} <span class="muted">Lv.${lv}</span></b><small>${d.desc}</small></div><button class="buy" data-id="${d.id}" ${current.money<c?"disabled":""}>$${fmt(c)}</button></div>`
}).join("");
document.querySelectorAll(".buy").forEach(b=>b.onclick=()=>buy(b.dataset.id));
}
function refresh(){
$("money").textContent=fmt(current.money);$("ore").textContent=fmt(current.ore);
$("power").textContent=fmt(1+(current.upgrades.power||0)+(current.upgrades.deep||0)*5);
$("auto").textContent=fmt(current.upgrades.auto||0);$("userLabel").textContent=current.username;
renderUpgrades();
}
function buy(id){
let d=defs.find(x=>x.id===id),c=cost(d);
if(current.money<c)return;
current.money-=c;current.upgrades[id]=(current.upgrades[id]||0)+1;
addLog(`Bought ${d.name}`);toast("Upgrade purchased");saveAccounts();refresh();
}
function mine(){
let amount=1+(current.upgrades.power||0)+(current.upgrades.deep||0)*5;
let value=1+(current.upgrades.mult||0);
current.ore+=amount;current.money+=amount*value;
$("pick").classList.add("hit");setTimeout(()=>$("pick").classList.remove("hit"),90);
if(Math.random()<.08){let bonus=amount*5;current.money+=bonus;addLog(`Lucky ore vein! +$${fmt(bonus)}`)}
refresh();
}
$("mineBtn").onclick=mine;
$("switch").onclick=()=>{
loginMode=!loginMode;$("authBtn").textContent=loginMode?"Log in":"Create account";
$("switch").textContent=loginMode?"Need an account? Sign up":"Already have an account? Log in";
$("authMsg").textContent="";
};
$("authBtn").onclick=()=>{
let u=$("username").value.trim().toLowerCase(),p=$("password").value;
if(!u||p.length<4){$("authMsg").textContent="Enter a username and a password of at least 4 characters.";return}
if(loginMode){
if(!accounts[u]||accounts[u].password!==hash(p)){$("authMsg").textContent="Invalid username or password.";return}
current=accounts[u].data;current.username=u;
}else{
if(accounts[u]){$("authMsg").textContent="That username already exists.";return}
current={username:u,money:0,ore:0,upgrades:{},lastSeen:Date.now()};
accounts[u]={password:hash(p),data:current};saveAccounts();
}
let now=Date.now(),away=Math.max(0,Math.floor((now-(current.lastSeen||now))/1000));
let auto=current.upgrades.auto||0,earned=away*auto;
if(earned>0){current.ore+=earned;current.money+=earned*(1+(current.upgrades.mult||0));$("offline").textContent=`You were away for ${Math.floor(away/60)}m ${away%60}s and earned ${fmt(earned)} ore.`}
current.lastSeen=now;accounts[u].data=current;saveAccounts();
$("auth").classList.add("hidden");$("app").classList.remove("hidden");refresh();addLog(`Welcome back, ${u}.`);
};
$("reset").onclick=()=>{
if(confirm("Reset all progress for this account?")){
current.money=0;current.ore=0;current.upgrades={};current.lastSeen=Date.now();saveAccounts();refresh();addLog("Account progress reset.");
}};
setInterval(()=>{
if(!current)return;
let now=Date.now(),sec=Math.min(5,(now-lastTick)/1000);lastTick=now;
let auto=current.upgrades.auto||0;
if(auto){let gain=auto*sec;current.ore+=gain;current.money+=gain*(1+(current.upgrades.mult||0));refresh()}
if(now-lastSave>5000){current.lastSeen=now;accounts[current.username].data=current;saveAccounts();lastSave=now}
},1000);
window.addEventListener("beforeunload",()=>{if(current){current.lastSeen=Date.now();accounts[current.username].data=current;saveAccounts()}});
</script>
</body>
</html>
